function fix(i){ i.subtasks=Array.isArray(i.subtasks)?i.subtasks:[]; i.comments=Array.isArray(i.comments)?i.comments:[]; return i; }
// ---------- dates ----------
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function parse(s){if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],m[2]-1,+m[3]):null}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function days(s){const d=parse(s);return d?Math.round((d-today())/864e5):null}
function dueLabel(it){
const n=days(it.due); if(n===null) return null;
const d=parse(it.due), fmt=d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
if(it.status==="done") return {t:fmt,c:""};
if(n<0) return {t:(n===-1?"Yesterday":fmt+" · "+(-n)+"d overdue"),c:"late"};
if(n===0) return {t:"Today",c:"soon"}; if(n===1) return {t:"Tomorrow",c:"soon"};
if(n<7) return {t:d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}),c:""};
return {t:fmt,c:""};
}
function ago(s){const m=Math.round((Date.now()-new Date(s))/6e4);if(m<1)return"now";if(m<60)return m+"m";const h=Math.round(m/60);if(h<24)return h+"h";return new Date(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
// ---------- filters ----------
const isOpen=i=>i.status!=="done";
const mine=i=>person==="all"||i.owner===person||i.owner==="both";
function matches(i){
if(!mine(i)) return false;

if(q){const s=(i.title+" "+(i.note||"")+" "+(i.src||"")+" "+i.area+" "+OWN[i.owner]+" "+i.subtasks.map(x=>x.t).join(" ")).toLowerCase(); if(!s.includes(q)) return false;}

}
const P={
overdue:i=>isOpen(i)&&days(i.due)!==null&&days(i.due)<0,
week:i=>isOpen(i)&&days(i.due)!==null&&days(i.due)>=0&&days(i.due)<=7,
waiting:i=>i.status==="waiting"||i.status==="check",
p1:i=>isOpen(i)&&+i.pri===1,

const TILES=[["overdue","Overdue","flame","#D63B2F"],["week","Next 7 Days","cal","#244570"],["waiting","Waiting","clock","#B97A06"],["p1","Priority","flag","#E85B25"]];

function groupHTML(title,list,cls){return `<section class="group"><h2 class="${cls||""}">${esc(title)}<small>${list.length}</small></h2><div class="list">${list.map(row).join("")}</div></section>`}

function boardHTML(base){
return `<div class="board" id="board">`+COLS.map(([k,l,c])=>{

if(k==="done"){ list=list.sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||""))); if(list.length>12){more=`<div class="kmore">+ ${list.length-12} older in Completed</div>`;list=list.slice(0,12);} }
return `<section class="kcol" data-col="${k}"><header><i style="background:${c}"></i>${l}<small>${base.filter(i=>colOf(i)===k).length}</small></header><div class="kdrop" data-col="${k}">${list.map(card).join("")||'<div class="kempty">Drop actions here</div>'}${more}</div></section>`;
}).join("")+`</div>`;

function calendarHTML(base){
const y=calMonth.getFullYear(), m=calMonth.getMonth();
const first=new Date(y,m,1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
const by={}; base.filter(i=>i.due).forEach(i=>{(by[i.due]=by[i.due]||[]).push(i)});

for(let k=0;k<42;k++){

const noDate=base.filter(i=>isOpen(i)&&!i.due).length;
return `<div class="calwrap"><div class="calhead"><button class="iconbtn" data-cal="-1" aria-label="Previous month">${I.left}</button>
<h2>${calMonth.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</h2>
<button class="iconbtn" data-cal="1" aria-label="Next month">${I.right}</button><button class="todaybtn" data-cal="0">Today</button></div>
<div class="cgrid">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w=>`<span class="cw">${w}</span>`).join("")}${cells}</div></div>
<section class="group"><h2>${esc(selDate)}<small>${selList.length}</small></h2><div class="list">${selList.map(row).join("")||'<div class="empty">Nothing due this day.</div>'}</div></section>
${noDate?`<p class="foot">${noDate} open action${noDate>1?"s have":" has"} no due date, so ${noDate>1?"they don't":"it doesn't"} appear here or in calendar alerts.</p>`:""}`;

$("#sheet").querySelectorAll('[data-pick="owner"] button').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===editing.owner))); hint(); });
// subtasks

$("#subCount").textContent=s.length?`${s.filter(x=>x.d).length}/${s.length}`:"";
$("#subs").innerHTML=s.map((x,k)=>`<div class="subrow ${x.d?"done":""}"><button class="circle ${x.d?"on":""}" data-sub="${k}" aria-label="Toggle subtask">${I.tick}</button><span>${esc(x.t)}</span><button class="subx" data-subx="${k}" aria-label="Remove subtask">${I.x}</button></div>`).join(""); };
drawSubs();
$("#subs").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
if(b.dataset.sub!==undefined){editing.subtasks[+b.dataset.sub].d=!editing.subtasks[+b.dataset.sub].d;}
if(b.dataset.subx!==undefined){editing.subtasks.splice(+b.dataset.subx,1);}
drawSubs(); liveSave();});
$("#newSub").addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ev.preventDefault();const v=ev.target.value.trim();if(!v)return;editing.subtasks.push({t:v,d:false});ev.target.value="";drawSubs();liveSave();} });
// comments
const drawThread=()=>{ $("#thread").innerHTML=editing.comments.length?editing.comments.map(c=>`<div class="cm ${c.by===cfg.who?"me":""}"><div class="bub">${esc(c.t)}</div><div class="cmeta">${c.by==="praj"?"Prajakta":c.by==="dev"?"Dev":"Someone"} · ${ago(c.at)}</div></div>`).join(""):'<div class="nocm">No comments yet. Use this to ask each other questions about this action.</div>'; const th=$("#thread"); th.scrollTop=th.scrollHeight; };
drawThread();
const ta=$("#newCmt"); ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,120)+"px"});
$("#sendCmt").onclick=()=>{ const v=ta.value.trim(); if(!v) return; 
editing.comments.push({by:cfg.who,t:v,at:new Date().toISOString()}); ta.value=""; ta.style.height="auto"; drawThread(); liveSave(); };
function liveSave(){ if(isNew) return; const orig=items.find(x=>x.id===editing.id); if(orig) commit(orig,{subtasks:JSON.parse(JSON.stringify(editing.subtasks)),comments:JSON.parse(JSON.stringify(editing.comments))},true); }
$("#sCancel").onclick=closeSheet;
$("#sSave").onclick=()=>{
const t=$("#fTitle").value.trim(); if(!t){$("#fTitle").focus();return;}
const pend=$("#newSub").value.trim(); if(pend) editing.subtasks.push({t:pend,d:false});
Object.assign(editing,{title:t,note:$("#fNote").value.trim(),due:$("#fDue").value||"",area:$("#fArea").value,src:$("#fSrc").value.trim()});
if(isNew){ items.push(editing); commit(editing,{}); toast(editing.due?"Added · alert set in calendar":"Added"); }
else { const orig=items.find(x=>x.id===editing.id); commit(orig,editing); toast("Saved"); }
closeSheet();
};
const del=$("#sDel"); if(del) del.onclick=()=>{
$("#delWrap").innerHTML=`<div class="confirm"><button class="no" id="dNo">Keep</button><button class="yes" id="dYes">Delete</button></div>`;
$("#dNo").onclick=()=>{$("#delWrap").innerHTML='<button class="danger" id="sDel">Delete Action</button>';$("#sDel").onclick=del.onclick;};
$("#dYes").onclick=()=>{ items=items.filter(x=>x.id!==it.id); cache(); enqueue({op:"delete",id:it.id}); closeSheet(); toast("Deleted"); };
};
}
function closeSheet(){ $("#backdrop").hidden=true; document.body.style.overflow=""; editing=null; render(); }
$("#backdrop").addEventListener("click",e=>{ if(e.target.id==="backdrop") closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("#backdrop").hidden) closeSheet(); });
// ---------- encryption for private actions ----------
const CAN_LOCK=!!(window.crypto&&crypto.subtle);
let cryptoKey=null;
const u8=s=>new TextEncoder().encode(s);
function b64(buf){const a=new Uint8Array(buf);let s="";for(let k=0;k<a.length;k++)s+=String.fromCharCode(a[k]);return btoa(s)}
function unb64(s){const b=atob(s),a=new Uint8Array(b.length);for(let k=0;k<b.length;k++)a[k]=b.charCodeAt(k);return a}
async function getKey(pass){
if(!pass&&cryptoKey) return cryptoKey;
const base=await crypto.subtle.importKey("raw",u8(pass||cfg.pass),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8("indwoke-workboard:"+cfg.who),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
if(!pass) cryptoKey=k; return k;
}
async function seal(obj,pass){const k=await getKey(pass);const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,u8(JSON.stringify(obj)));return "v1:"+b64(iv)+":"+b64(ct)}
async function unseal(s){const p=String(s).split(":");const k=await getKey();const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(p[1])},k,unb64(p[2]));return JSON.parse(new TextDecoder().decode(pt))}
const SECRET=["title","note","subtasks","comments","src","url"];
async function openPrivate(list){
for(const i of list){ if(!i.private||!i.secret) continue;
try{ const o=await unseal(i.secret); SECRET.forEach(k=>{ if(o[k]!==undefined) i[k]=o[k]; }); i._locked=false; }
catch(e){ i.title="🔒 Private action (can't unlock on this device)"; i._locked=true; }
fix(i);
}
return list;
}
async function forSend(it,pass){
const o=clean(it); if(!o.private) return o;
const s={}; SECRET.forEach(k=>s[k]=it[k]);
o.secret=await seal(s,pass); SECRET.forEach(k=>{o[k]=k==="subtasks"||k==="comments"?[]:""}); o.title="🔒 Private action";
return o;
}
// ---------- data ----------
const FIELDS=["id","title","owner","area","pri","due","status","src","url","note","order","updatedAt","updatedBy","subtasks","comments","private"];
function clean(o){const r={};FIELDS.forEach(k=>{if(o[k]!==undefined)r[k]=o[k]});return r}
function cache(){ls("wb.items",items)}
function commit(it,patch,quiet){ Object.assign(it,patch,{updatedAt:new Date().toISOString()}); if(cfg.who) it.updatedBy=OWN[cfg.who]; cache(); if(!quiet||!editing) render(); if(!it._locked) enqueue({op:"save",item:clean(it)}); queueAlerts(); }
function enqueue(op){ queue=queue.filter(x=>!(op.op==="save"&&x.op==="save"&&x.item.id===op.item.id)); queue.push(op); ls("wb.queue",queue); setSync(); flush(); }
function post(body){
return fetch(cfg.url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
.then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||"error"); return j; });
}
function call(op,payload){
const b={op,who:cfg.who,pass:cfg.pass};
if(op==="save") b.item=payload; if(op==="delete") b.id=payload;
return post(b).then(j=>op==="list"?j.items:j);
}
const unauthorized=e=>/passcode|too many/i.test(String(e&&e.message||e));
async function flush(){
if(busy||!cfg.pass) return; busy=true;
try{ while(queue.length){ const op=queue[0]; const payload=op.op==="save"?await forSend(op.item):op.id; await call(op.op,payload); queue.shift(); ls("wb.queue",queue); online=true; } }
catch(e){ online=false; if(unauthorized(e)) showSetup(String(e.message||e)); }
busy=false; setSync();
}
async function load(manual){
if(!cfg.who||!cfg.pass){ showSetup(); return; }
if(manual) $("#refresh").classList.add("spin");
await flush();
if(!queue.length && !editing){
try{ const data=await call("list"); items=await openPrivate(data.map(fix)); cache(); online=true; lastSync=new Date(); render(); queueAlerts(); }
catch(e){ online=false; if(unauthorized(e)) showSetup(String(e.message||e)); }
}
$("#refresh").classList.remove("spin"); setSync();
}
function setSync(){
const d=$("#dot"), t=$("#syncText"), b=$("#banner");
if(queue.length){ d.className="warn"; t.textContent=queue.length+" to sync"; }
else if(online){ d.className="ok"; t.textContent=lastSync?lastSync.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"Synced"; }
else { d.className=items.length?"warn":""; t.textContent=items.length?"Offline":"Loading"; }
const off=!online&&(items.length||queue.length);
b.hidden=!off; if(off) b.textContent=queue.length?"You're offline. Changes are saved on this device and will sync automatically.":"You're offline. Showing the last copy saved on this device.";
}
// ---------- sign in / passcodes ----------
let setupMode="";
function showSetup(msg){
$("#setup").hidden=false; $("#setupErr").textContent=msg||"";
document.querySelectorAll("#whoSeg [data-who]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.who===cfg.who)));
if(cfg.who) pickWho(cfg.who,true); else { $("#signinBox").hidden=true; $("#claimBox").hidden=true; }
}
async function pickWho(w,keepMsg){
cfg.who=w; cryptoKey=null;
document.querySelectorAll("#whoSeg [data-who]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.who===w)));
if(!keepMsg) $("#setupErr").textContent="";
$("#signinBox").hidden=true; $("#claimBox").hidden=true; $("#setupWait").hidden=false;
try{ const j=await post({op:"status",who:w}); setupMode=j.claimed?"signin":"claim"; }
catch(e){ setupMode="signin"; $("#setupErr").textContent="Couldn't reach the Workboard. Check your connection."; }
$("#setupWait").hidden=true;
$("#signinBox").hidden=setupMode!=="signin"; $("#claimBox").hidden=setupMode!=="claim";
$("#setupHello").textContent=(setupMode==="claim"?"Welcome, ":"Hi ")+OWN[w];
setTimeout(()=>{ const f=setupMode==="claim"?$("#invite"):$("#pass"); if(f) f.focus(); },50);
}
document.querySelectorAll("#whoSeg [data-who]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();pickWho(b.dataset.who)}));
async function finishSignIn(pass){
cfg.pass=pass; cryptoKey=null;
const data=await call("list");
if(cfg.who!==ls("wb.cfg")?.who){ items=[]; queue=[]; ls("wb.queue",[]); }
ls("wb.cfg",cfg); items=await openPrivate(data.map(fix)); cache(); online=true; lastSync=new Date();
person=cfg.who; ls("wb.person",person); $("#setup").hidden=true; $("#setupForm").reset(); render(); setSync(); queueAlerts(); flush();
}
$("#setupForm").addEventListener("submit",async e=>{
e.preventDefault(); const err=$("#setupErr");
if(!cfg.who){ err.textContent="Tap Dev or Prajakta first."; return; }
try{
if(setupMode==="claim"){
const inv=$("#invite").value.trim(), p1=$("#newPass").value, p2=$("#newPass2").value;
if(p1.length<6){ err.textContent="Use at least 6 characters."; return; }
if(p1!==p2){ err.textContent="The two passcodes don't match."; return; }
err.textContent="Creating your passcode…";
await post({op:"claim",who:cfg.who,invite:inv,newPass:p1});
await finishSignIn(p1);
} else {
err.textContent="Signing in…"; await finishSignIn($("#pass").value);
}
}catch(x){ err.textContent=String(x.message||x).replace(/^Error: /,""); cfg.pass=""; }
});
// ---------- settings ----------
function openSettings(){
const mineP=items.filter(i=>i.private&&i.owner===cfg.who).length;
$("#sheet").innerHTML=`<div class="grab"></div><header><span></span><h3>Settings</h3><button class="strong" id="stClose">Done</button></header>
<div class="body">
<div class="fgroup"><div class="frow"><span>Signed in as</span><span class="val"><span class="av">${cfg.who==="praj"?'<i class="p">P</i>':'<i class="d">D</i>'}</span> ${OWN[cfg.who]||""}</span></div><div class="sep"></div>
<div class="frow"><span>Your private actions</span><span class="val">${mineP}</span></div></div>
<div class="flabel">Change passcode</div>
<div class="fgroup"><input type="password" id="cp1" placeholder="New passcode (6+ characters)" class="plain"><div class="sep"></div><input type="password" id="cp2" placeholder="Type it again" class="plain"><div class="sep"></div><button class="rowbtn" id="cpGo">Change passcode</button></div>
<p class="foot" id="cpMsg">Your private actions are re-locked with the new passcode automatically.</p>
<div class="flabel">Reminders</div>
<div class="fgroup"><div class="frow"><span>Google Calendar</span><span class="val">9 AM, day before &amp; due day</span></div>${LN?`<div class="sep"></div><div class="frow"><span>Phone notifications</span><span class="val">On</span></div>`:""}</div>
<div class="fgroup" style="margin-top:18px"><button class="danger" id="soGo">Sign out of this device</button></div>
<p class="foot">Indwoke Workboard v3</p>
</div>`;
openBackdrop();
$("#stClose").onclick=closeSheet;
$("#cpGo").onclick=async()=>{
const a=$("#cp1").value,b=$("#cp2").value,m=$("#cpMsg");
if(a.length<6){m.textContent="Use at least 6 characters.";return;} if(a!==b){m.textContent="The two passcodes don't match.";return;}
m.textContent="Changing…";
try{
await flush();
const mine=items.filter(i=>i.private&&i.owner===cfg.who&&!i._locked);
const resealed=[]; for(const i of mine) resealed.push(await forSend(i,a));
await post({op:"change",who:cfg.who,pass:cfg.pass,newPass:a});
cfg.pass=a; cryptoKey=null; ls("wb.cfg",cfg);
for(const r of resealed) await call("save",r);
m.textContent="Passcode changed."; $("#cp1").value=$("#cp2").value="";
}catch(x){ m.textContent=String(x.message||x); }
};
$("#soGo").onclick=()=>{ cfg={url:cfg.url}; ls("wb.cfg",cfg); items=[]; queue=[]; cache(); ls("wb.queue",[]); cryptoKey=null; closeSheet(); showSetup(); };
}
// ---------- phone notifications (Android app) ----------
let alertTimer=null;
function queueAlerts(){ if(!LN) return; clearTimeout(alertTimer); alertTimer=setTimeout(scheduleAlerts,1500); }
async function scheduleAlerts(){
if(!LN||!cfg.who) return;
try{
let perm=await LN.checkPermissions();
if(perm.display!=="granted"){ perm=await LN.requestPermissions(); if(perm.display!=="granted") return; }
const pend=await LN.getPending();
if(pend.notifications&&pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
const now=new Date(), list=[]; let nid=1;
const mineIt=items.filter(i=>isOpen(i)&&(i.owner===cfg.who||i.owner==="both"));
const base={smallIcon:"ic_stat_workboard",iconColor:"#E85B25"};
mineIt.forEach(i=>{ const d=parse(i.due); if(!d) return;
const at=new Date(d); at.setHours(9,0,0,0); const before=new Date(at); before.setDate(at.getDate()-1);
const hi=+i.pri===1?"‼️ ":"";
if(at>now) list.push(Object.assign({id:nid++,title:hi+"Due today",body:i.title,schedule:{at,allowWhileIdle:true},extra:{id:i.id}},base));
if(before>now) list.push(Object.assign({id:nid++,title:hi+"Due tomorrow",body:i.title,schedule:{at:before,allowWhileIdle:true},extra:{id:i.id}},base));
});
list.sort((a,b)=>a.schedule.at-b.schedule.at);
const out=list.slice(0,60);
const od=mineIt.filter(P.overdue);
if(od.length) out.push(Object.assign({id:9000,title:"⚠️ "+od.length+" overdue action"+(od.length>1?"s":""),body:od.sort(sortDue).slice(0,3).map(x=>x.title).join(" · "),schedule:{on:{hour:9,minute:0},allowWhileIdle:true}},base));
if(out.length) await LN.schedule({notifications:out});
}catch(e){ console.warn("alerts",e); }
}
if(LN){ try{ LN.addListener("localNotificationActionPerformed",ev=>{ const id=ev&&ev.notification&&ev.notification.extra&&ev.notification.extra.id; const it=id&&items.find(x=>String(x.id)===String(id)); if(it) setTimeout(()=>openSheet(it),400); }); }catch(e){} }
// ---------- boot ----------
render(); setSync(); load();
setInterval(()=>{ if(document.visibilityState==="visible") load(); },30000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") load(); });
window.addEventListener("online",()=>load());
if(!NATIVE && "serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
